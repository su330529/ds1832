name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: locate project
        run: |
          set -euo pipefail
          if [ -f ds1832-source.zip ]; then
            unzip -q -o ds1832-source.zip -d work
          fi
          PROJ=$(find . -name 'ds1832.xcodeproj' -maxdepth 5 -type d | head -1)
          test -n "$PROJ"
          echo "ROOT=$(dirname "$PROJ")" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: build unsigned ipa
        run: |
          set -euo pipefail
          cd "$ROOT"
          chmod +x build.sh
          ./build.sh
          ls -la ds1832.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ds1832-ipa
          path: ${{ env.ROOT }}/ds1832.ipa
          if-no-files-found: error
